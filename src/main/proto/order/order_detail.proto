syntax = "proto3";

package example.order;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.example.protobuf.order";
option java_multiple_files = true;

// 주문 상세: 기본 스칼라 타입 외의 타입(oneof, map, Well-Known Types, Any)을 모아 둔 메시지
message OrderDetail {
  int64 order_id = 1;

  // oneof: 이 중 하나만 설정된다. 다른 필드를 set하면 이전 값은 지워진다
  oneof payment_method {
    CardPayment card = 3;
    BankTransferPayment bank_transfer = 4;
  }

  // map: 바이너리에서는 repeated AttributesEntry { key = 1; value = 2; } 로 기록된다
  map<string, string> attributes = 5;

  // Well-Known Types: 시각과 기간
  google.protobuf.Timestamp ordered_at = 6;
  google.protobuf.Duration delivery_time = 7;

  // Any: 어떤 메시지든 담을 수 있다 (타입 URL + 직렬화된 바이트)
  google.protobuf.Any extra = 8;
}

message CardPayment {
  string card_number = 1;
  int32 installment_months = 2;
}

message BankTransferPayment {
  string bank_name = 1;
  string account_number = 2;
}

// Any에 담아 보낼 부가 정보 예시
message GiftOption {
  string message = 1;
}
